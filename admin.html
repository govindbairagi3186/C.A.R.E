<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        C.A.R.E. Admin Dashboard
    </title>

    <meta
        name="theme-color"
        content="#0b5ed7"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .topbar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: #0b5ed7;
            color: white;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 21px;
        }

        .brand strong {
            font-size: 20px;
        }

        .brand small {
            display: block;
            color: #64748b;
            font-size: 10px;
        }

        .admin-badge {
            background: #eff6ff;
            color: #0b5ed7;
            padding: 8px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .container {
            width: min(1250px, calc(100% - 40px));
            margin: auto;
        }

        .dashboard {
            padding: 40px 0;
        }

        .heading {
            margin-bottom: 30px;
        }

        .heading span {
            color: #0b5ed7;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.3px;
        }

        .heading h1 {
            font-size: 38px;
            margin: 5px 0;
        }

        .heading p {
            color: #64748b;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px;
        }

        .stat-icon {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .stat strong {
            display: block;
            font-size: 30px;
        }

        .stat span {
            color: #64748b;
            font-size: 13px;
        }

        .toolbar {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toolbar input,
        .toolbar select {
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
        }

        .toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .refresh {
            background: #0b5ed7;
            color: white;
            border: none;
            padding: 11px 17px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .reports {
            display: grid;
            gap: 18px;
        }

        .report {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 190px 1fr;
        }

        .report-image {
            min-height: 190px;
            background: #eff6ff;
            display: grid;
            place-items: center;
            font-size: 55px;
        }

        .report-image img {
            width: 100%;
            height: 100%;
            min-height: 190px;
            object-fit: cover;
        }

        .report-content {
            padding: 22px;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 8px;
        }

        .report-header h2 {
            font-size: 20px;
        }

        .report-code {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .description {
            color: #475569;
            margin-bottom: 15px;
        }

        .details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .detail {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions select {
            padding: 9px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        .map-button {
            text-decoration: none;
            background: #0f172a;
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .save-button {
            border: none;
            background: #16a34a;
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .reported {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .verified {
            background: #fef3c7;
            color: #92400e;
        }

        .progress {
            background: #ede9fe;
            color: #6d28d9;
        }

        .resolved {
            background: #dcfce7;
            color: #166534;
        }

        .empty {
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            padding: 60px;
            text-align: center;
            color: #64748b;
        }

        .empty div {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        @media(max-width: 850px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .report {
                grid-template-columns: 1fr;
            }

            .report-image {
                min-height: 220px;
            }

        }

        @media(max-width: 550px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 14px 18px;
            }

            .container {
                width: min(100% - 24px, 1250px);
            }

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            C
        </div>

        <div>

            <strong>
                C.A.R.E.
            </strong>

            <small>
                Civic Action and Reporting Engine
            </small>

        </div>

    </div>

    <div class="admin-badge">
        🛡️ ADMIN DASHBOARD
    </div>

</header>


<main class="dashboard">

    <div class="container">


        <div class="heading">

            <span>
                CIVIC MANAGEMENT
            </span>

            <h1>
                Issue Dashboard
            </h1>

            <p>
                Monitor and manage citizen-reported
                civic issues.
            </p>

        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-icon">
                    📊
                </div>

                <strong id="total">
                    0
                </strong>

                <span>
                    Total Reports
                </span>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    🕳️
                </div>

                <strong id="potholes">
                    0
                </strong>

                <span>
                    Potholes
                </span>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    🗑️
                </div>

                <strong id="garbage">
                    0
                </strong>

                <span>
                    Garbage
                </span>

            </div>


            <div class="stat">

                <div class="stat-icon">
                    ✅
                </div>

                <strong id="resolved">
                    0
                </strong>

                <span>
                    Resolved
                </span>

            </div>

        </div>


        <div class="toolbar">

            <input
                id="search"
                type="search"
                placeholder="Search reports..."
                oninput="filterReports()"
            >

            <select
                id="categoryFilter"
                onchange="filterReports()"
            >

                <option value="">
                    All Categories
                </option>

                <option value="Pothole">
                    Potholes
                </option>

                <option value="Garbage">
                    Garbage
                </option>

                <option value="Streetlight">
                    Streetlights
                </option>

                <option value="Drainage">
                    Drainage
                </option>

                <option value="Road Damage">
                    Road Damage
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <select
                id="statusFilter"
                onchange="filterReports()"
            >

                <option value="">
                    All Statuses
                </option>

                <option value="Reported">
                    Reported
                </option>

                <option value="Verified">
                    Verified
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Resolved">
                    Resolved
                </option>

            </select>


            <button
                class="refresh"
                onclick="loadReports()"
            >
                ↻ Refresh
            </button>

        </div>


        <div id="errorBox"></div>


        <div
            id="reports"
            class="reports"
        >

            <div class="empty">

                <div>
                    ⏳
                </div>

                Loading reports...

            </div>

        </div>


    </div>

</main>


<script>

const SUPABASE_URL =
    "https://wcocovvkzxgxqbscyuuj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DaY-2qm2HWCUuLfhaXwFFg_Eg05_MX3";

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allReports = [];


async function loadReports() {

    const container =
        document.getElementById("reports");

    const errorBox =
        document.getElementById("errorBox");

    errorBox.innerHTML = "";

    container.innerHTML = `
        <div class="empty">
            <div>⏳</div>
            Loading reports...
        </div>
    `;


    const {
        data,
        error
    } = await client
        .from("issues")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        errorBox.innerHTML = `
            <div class="error">
                ⚠️ Could not load reports.
                ${escapeHTML(error.message)}
            </div>
        `;

        container.innerHTML = "";

        return;

    }


    allReports = data || [];

    updateStats(allReports);

    renderReports(allReports);

}


function updateStats(reports) {

    document.getElementById("total")
        .textContent = reports.length;


    document.getElementById("potholes")
        .textContent =
        reports.filter(
            r => r.category === "Pothole"
        ).length;


    document.getElementById("garbage")
        .textContent =
        reports.filter(
            r => r.category === "Garbage"
        ).length;


    document.getElementById("resolved")
        .textContent =
        reports.filter(
            r => r.status === "Resolved"
        ).length;

}


function filterReports() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();


    const category =
        document
            .getElementById("categoryFilter")
            .value;


    const status =
        document
            .getElementById("statusFilter")
            .value;


    const filtered =
        allReports.filter(
            report => {

                const text =
                    `
                    ${report.issue_code || ""}
                    ${report.category || ""}
                    ${report.description || ""}
                    `.toLowerCase();


                return (

                    text.includes(search)

                    &&

                    (
                        !category ||
                        report.category === category
                    )

                    &&

                    (
                        !status ||
                        report.status === status
                    )

                );

            }
        );


    renderReports(filtered);

}


function renderReports(reports) {

    const container =
        document.getElementById("reports");


    if (!reports.length) {

        container.innerHTML = `
            <div class="empty">
                <div>📍</div>
                <strong>No reports found</strong>
                <p>
                    Citizen reports will appear here.
                </p>
            </div>
        `;

        return;

    }


    container.innerHTML =
        reports.map(
            report => createReportHTML(report)
        ).join("");

}


function createReportHTML(report) {

    const icon =
        getIcon(report.category);


    const statusClass =
        getStatusClass(report.status);


    const imageHTML =
        report.image_url

        ?

        `
        <div class="report-image">

            <img
                src="${escapeHTML(report.image_url)}"
                alt="Reported civic issue"
            >

        </div>
        `

        :

        `
        <div class="report-image">
            ${icon}
        </div>
        `;


    const mapsURL =
        `https://www.google.com/maps?q=${encodeURIComponent(
            report.latitude
        )},${encodeURIComponent(
            report.longitude
        )}`;


    return `

        <article class="report">

            ${imageHTML}

            <div class="report-content">

                <div class="report-header">

                    <h2>
                        ${escapeHTML(
                            report.category || "Issue"
                        )}
                    </h2>

                    <span
                        class="status ${statusClass}"
                    >
                        ${escapeHTML(
                            report.status || "Reported"
                        )}
                    </span>

                </div>


                <div class="report-code">

                    Report ID:
                    <strong>
                        ${escapeHTML(
                            report.issue_code || "N/A"
                        )}
                    </strong>

                </div>


                <p class="description">

                    ${escapeHTML(
                        report.description || ""
                    )}

                </p>


                <div class="details">

                    <span class="detail">
                        📍 ${escapeHTML(
                            String(report.latitude || "N/A")
                        )},
                        ${escapeHTML(
                            String(report.longitude || "N/A")
                        )}
                    </span>

                    <span class="detail">
                        ⚡ ${escapeHTML(
                            report.priority || "Medium"
                        )}
                    </span>

                    <span class="detail">
                        🕒 ${formatDate(
                            report.created_at
                        )}
                    </span>

                </div>


                <div class="actions">

                    <a
                        class="map-button"
                        href="${mapsURL}"
                        target="_blank"
                        rel="noopener"
                    >
                        📍 Open Map
                    </a>


                    <select
                        id="status-${escapeHTML(report.id)}"
                    >

                        <option
                            value="Reported"
                            ${report.status === "Reported" ? "selected" : ""}
                        >
                            Reported
                        </option>

                        <option
                            value="Verified"
                            ${report.status === "Verified" ? "selected" : ""}
                        >
                            Verified
                        </option>

                        <option
                            value="In Progress"
                            ${report.status === "In Progress" ? "selected" : ""}
                        >
                            In Progress
                        </option>

                        <option
                            value="Resolved"
                            ${report.status === "Resolved" ? "selected" : ""}
                        >
                            Resolved
                        </option>

                    </select>


                    <button
                        class="save-button"
                        onclick="updateStatus('${escapeJS(report.id)}')"
                    >
                        Save Status
                    </button>

                </div>

            </div>

        </article>

    `;

}


async function updateStatus(id) {

    const select =
        document.getElementById(
            `status-${id}`
        );


    if (!select) {

        return;

    }


    const newStatus =
        select.value;


    const {
        error
    } = await client
        .from("issues")
        .update({
            status: newStatus
        })
        .eq(
            "id",
            id
        );


    if (error) {

        alert(
            "Could not update status: " +
            error.message
        );

        console.error(error);

        return;

    }


    alert(
        "Status updated successfully."
    );


    await loadReports();

}


function getIcon(category) {

    const icons = {

        "Pothole": "🕳️",

        "Garbage": "🗑️",

        "Streetlight": "💡",

        "Drainage": "🌊",

        "Road Damage": "🚧",

        "Other": "📍"

    };


    return icons[category] || "📍";

}


function getStatusClass(status) {

    if (status === "Verified") {
        return "verified";
    }

    if (status === "In Progress") {
        return "progress";
    }

    if (status === "Resolved") {
        return "resolved";
    }

    return "reported";

}


function formatDate(date) {

    if (!date) {
        return "Unknown";
    }


    return new Date(date)
        .toLocaleString(
            "en-IN",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

}


function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}


function escapeJS(value) {

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll('"', '\\"');

}


loadReports();

</script>


</body>

</html>
